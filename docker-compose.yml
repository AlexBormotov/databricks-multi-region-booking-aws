# Local stack: the dev container plus the free emulators the integration tests use.
services:
  dev:
    build: .devcontainer
    image: ghcr.io/alexbormotov/databricks-multi-region-booking-aws-dev:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      - venv:/opt/venv
      # `--provider-cache` links providers from here into each unit's .terraform; without a volume
      # the links dangle in the next container, and `make down` cannot read outputs.
      - terragrunt-cache:/root/.cache/terragrunt
      - ${HOME:-${USERPROFILE}}/.aws:/root/.aws
    environment:
      DATABASE_URL: postgresql://booking:booking@postgres:5432/booking
      # Not AWS_ENDPOINT_URL: that would also send terraform and the aws CLI to moto.
      MOTO_ENDPOINT_URL: http://moto:5000
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      # Passed through from the host when set: an SSO profile locally, OIDC credentials in CI.
      AWS_PROFILE:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      TF_VAR_budget_email:
    depends_on:
      postgres: {condition: service_healthy}
      moto: {condition: service_started}
      dynamodb: {condition: service_started}

  postgres:
    image: postgres:16.15-trixie
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    # The contention test opens many connections at once.
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "booking"]
      interval: 1s
      retries: 30

  moto:
    image: motoserver/moto:5.2.4

  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]

volumes:
  venv:
  terragrunt-cache:
