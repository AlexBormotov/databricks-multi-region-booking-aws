[project]
name = "booking"
version = "0.1.0"
description = "Multi-region hotel booking with zero double bookings, plus a Databricks lakehouse"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aurora-dsql-python-connector>=0.2.7",
    "boto3>=1.43",
    "psycopg[binary,pool]>=3.3.6",
]

[dependency-groups]
dev = [
    "jsonschema>=4.25",
    "moto[server]>=5.2.4",
    "pyspark==4.1.*",
    "pytest>=9.1",
    "pyyaml>=6.0.2",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored from the AI-factory kit; kept as shipped.
extend-exclude = [".agents", ".claude", "ai-factory-kit"]

[tool.ruff.per-file-target-version]
# Serverless pipelines run Python 3.12.
"src/lakehouse/**" = "py312"
"databricks/**" = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
