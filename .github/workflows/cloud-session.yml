# The one paid run: make up -> make demo -> collect artifacts -> make down, whatever happened before.
# demo is a stub until slice C2.
name: cloud-session

on:
  workflow_dispatch:
    inputs:
      scale:
        description: Synthetic data volume
        type: choice
        options: [small, demo]
        default: small

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: cloud-session
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alexbormotov/databricks-multi-region-booking-aws-dev

jobs:
  session:
    runs-on: ubuntu-24.04
    environment: demo-prod # required reviewer approves every run
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Use the pinned image as the compose image
        run: |
          REF="$IMAGE:${{ hashFiles('.devcontainer/Dockerfile') }}"
          docker pull -q "$REF" && docker tag "$REF" "$IMAGE:local"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: make up
      - run: make demo SCALE=${{ inputs.scale }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-session-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
      - if: always()
        run: make down
